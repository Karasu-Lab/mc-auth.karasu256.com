name: MC Auth Deploy

on:
  push:
    branches: ["**"]
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Lowercase the image name
        run: echo "IMAGE_NAME=${IMAGE_NAME,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.ref_name == 'main' }}
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          secrets: |
            npm_token=${{ secrets.GITHUB_TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    if: github.ref_name == 'main'
    needs: build
    environment: production
    runs-on: ubuntu-latest
    env:
      COOLIFY_HOST: ${{ vars.COOLIFY_HOST }}
      CI_DEPLOY_TOKEN: ${{ secrets.CI_DEPLOY_TOKEN }}
    steps:
      - name: Set the secrets on the Coolify application
        env:
          INTERNAL_API_SECRET: ${{ secrets.INTERNAL_API_SECRET }}
          CLOUDFLARE_D1_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
        run: |
          uuid=$(curl --silent --show-error --fail \
            --header "Authorization: Bearer ${CI_DEPLOY_TOKEN}" \
            --header "Accept: application/json" \
            "${COOLIFY_HOST%/}/api/v1/applications?tag=mc-auth" | jq --raw-output '.[0].uuid')
          test -n "$uuid" -a "$uuid" != null
          jq --null-input \
            --arg internal_api_secret "$INTERNAL_API_SECRET" \
            --arg d1_api_token "$CLOUDFLARE_D1_API_TOKEN" \
            '{data: [{key: "INTERNAL_API_SECRET", value: $internal_api_secret, is_literal: true}, {key: "CLOUDFLARE_D1_API_TOKEN", value: $d1_api_token, is_literal: true}]}' \
            | curl --silent --show-error --fail --output /dev/null --request PATCH \
              --header "Authorization: Bearer ${CI_DEPLOY_TOKEN}" \
              --header "Content-Type: application/json" \
              --data @- \
              "${COOLIFY_HOST%/}/api/v1/applications/${uuid}/envs/bulk"
      - name: Deploy to Coolify
        run: |
          status=$(curl --silent --show-error --location --request POST --output response.json --write-out '%{http_code}' \
            --header "Authorization: Bearer ${CI_DEPLOY_TOKEN}" \
            --header "Accept: application/json" \
            "${COOLIFY_HOST%/}/api/v1/deploy?tag=mc-auth&force=true")
          cat response.json
          test "$status" -lt 400
